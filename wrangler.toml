name = "wissely-worker"
main = "worker.js"
compatibility_date = "2026-06-02"

# Wrangler auto-disables the *.workers.dev subdomain whenever a `routes`
# array is present, unless this is explicitly kept true. Keeping this on
# means the workers.dev URL keeps working as a fallback regardless of any
# custom domain or route config.
workers_dev = true

# ── Routes ─────────────────────────────────────────────────────────────────────
# Intentionally NOT declaring a `routes` array here. It was tried, but the
# GitHub Actions deploy's Cloudflare API token doesn't have the
# `Zone -> Workers Routes: Edit` permission needed to apply it - every
# deploy failed with "Authentication error [code: 10000]" on the
# /zones/.../workers/routes API call, even though the Worker script itself
# deployed successfully every time.
#
# It also turned out to be unnecessary: every frontend file (all 17 HTML
# pages) calls `https://api.wissely.com` directly now, not a relative path,
# so none of them depend on wissely.com routing to this Worker at all.
# `api.wissely.com` itself is configured as a Custom Domain instead (added
# manually via Workers & Pages -> wissely-worker -> Domains -> Add Domain),
# which uses a different permission scope than zone routes and deploys
# without issue.
#
# If routes are ever needed again in the future (e.g. to also serve
# app.wissely.com/* directly from this Worker), the CI token will need
# `Zone -> Workers Routes: Edit` added first at
# https://dash.cloudflare.com/profile/api-tokens, or they'll need to keep
# being added manually through the dashboard, which does not survive
# being reconciled away by a future `wrangler deploy` that declares no
# routes (as this one does).

# ── Cron Triggers ─────────────────────────────────────────────────────────────
# Fires at 00:00 UTC on the 1st of every month.
[triggers]
crons = ["0 0 1 * *"]

# ── D1 Database ───────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "wissely-db"
database_id = "b2ffe2c9-0ddf-4053-88fa-8377d837e962"

# ── KV Namespace — Rate Limiting ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "3b8bd68d09a64a9baaf52b64c76c9318"

# ── Application Variables ─────────────────────────────────────────────────────
[vars]
APP_URL = "https://app.wissely.com"

# ── Secrets ───────────────────────────────────────────────────────────────────
# Do NOT put secret values here.
# Set them using:
#
# wrangler secret put ANTHROPIC_API_KEY
# wrangler secret put RESEND_API_KEY
# wrangler secret put PADDLE_WEBHOOK_SECRET
#
# They will be available as:
# env.ANTHROPIC_API_KEY
# env.RESEND_API_KEY
# env.PADDLE_WEBHOOK_SECRET
