name = "wissely-worker"
main = "worker.js"
compatibility_date = "2026-06-02"

# ── Routes ─────────────────────────────────────────────────────────────────────
# Connects app.wissely.com to this Worker. Declared here, not just in the
# Cloudflare dashboard, because `wrangler deploy` (which runs on every push
# to main via .github/workflows/deploy.yml) treats this file as the source
# of truth for routing - routes added only through the dashboard are not
# guaranteed to survive the next automatic deploy.
#
# Do NOT add a bare "app.wissely.com/*" route - this Worker does not proxy
# unmatched paths back to the static Pages site (wissely-app), so a
# catch-all would take over the entire domain and break the Dashboard,
# auth pages, and every other static page.
routes = [
  { pattern = "app.wissely.com/health", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/webhook/paddle", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/register", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/login", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/logout", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/me", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/verify-email", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/forgot-password", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/reset-password", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/resend-verification", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/create-checkout", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/billing-portal", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/analyze", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/api/*", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/support/*", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/team/*", zone_name = "wissely.com" },
  { pattern = "app.wissely.com/webhooks*", zone_name = "wissely.com" }
]

# ── Cron Triggers ─────────────────────────────────────────────────────────────
# Fires at 00:00 UTC on the 1st of every month.
[triggers]
crons = ["0 0 1 * *"]

# ── D1 Database ───────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "wissely-db"
database_id = "b2ffe2c9-0ddf-4053-88fa-8377d837e962"

# ── KV Namespace — Rate Limiting ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "3b8bd68d09a64a9baaf52b64c76c9318"

# ── Application Variables ─────────────────────────────────────────────────────
[vars]
APP_URL = "https://app.wissely.com"

# ── Secrets ───────────────────────────────────────────────────────────────────
# Do NOT put secret values here.
# Set them using:
#
# wrangler secret put ANTHROPIC_API_KEY
# wrangler secret put RESEND_API_KEY
# wrangler secret put PADDLE_WEBHOOK_SECRET
#
# They will be available as:
# env.ANTHROPIC_API_KEY
# env.RESEND_API_KEY
# env.PADDLE_WEBHOOK_SECRET
