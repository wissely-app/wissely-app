name: Deploy Wissely Worker
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  deploy-staging:
    runs-on: ubuntu-latest
    # Deploys the staging environment (see wrangler.toml's [env.staging] -
    # separate Worker, separate D1 database, separate KV namespace) on
    # every push to main, same as production. This keeps staging running
    # the same code as production at all times, so it stays useful as a
    # safe place to run any test that involves touching the database
    # directly, without ever risking real customer data.
    #
    # `environment: staging` tells wrangler-action to deploy the
    # [env.staging] block from wrangler.toml (equivalent to running
    # `wrangler deploy --env staging` locally), and also pushes the
    # secrets listed below into that environment's own secret store -
    # secrets are not automatically shared between named environments in
    # Wrangler, so this step is what makes ANTHROPIC_API_KEY available to
    # staging at all.
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          environment: staging
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

